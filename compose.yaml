services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: edupulse
      POSTGRES_USER: edupulse
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupulse -d edupulse"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5001
      SERVE_CLIENT: "true"
      TRUST_PROXY: "true"
      ADMIN_SIGNUP_ENABLED: "false"
      DATABASE_URL: postgresql://edupulse:${DB_PASSWORD:?Set DB_PASSWORD in .env}@db:5432/edupulse?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      QR_SECRET: ${QR_SECRET:?Set QR_SECRET in .env}
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN in .env}
      CLIENT_URL: https://${DOMAIN:?Set DOMAIN in .env}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
